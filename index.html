<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title id="pageTitle">Raisa dari Plat A</title>
<meta property="og:title" id="ogTitle" content="Raisa dari Plat A">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff}
#page-landing{display:none;width:100%;max-width:480px;padding:16px}
.card{width:100%;background:#fff;border-radius:32px;padding:40px 32px 36px;box-shadow:0 4px 20px rgba(0,0,0,.06);text-align:center;border:1px solid #f0f0f0}
.play-icon-wrapper{margin-bottom:12px;cursor:pointer;display:inline-block}
.play-icon-wrapper i{font-size:72px;color:#1e293b}
.card h1{font-size:28px;color:#0b0d10;margin-bottom:20px;word-break:break-word}
.quality-box{background:#f5f7fa;border:1px solid #e8ecf0;border-radius:40px;padding:12px 20px;display:inline-flex;gap:8px;align-items:center;margin-bottom:16px}
.desc{color:#475569;font-size:16px;line-height:1.6;margin:0 0 28px}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:12px;background:#1e293b;border:0;border-radius:60px;padding:16px 24px;width:100%;font-size:18px;font-weight:600;color:white;cursor:pointer;margin-bottom:28px}
.footer-badges{display:flex;justify-content:center;gap:24px;padding-top:16px;border-top:1px solid #eceff3;flex-wrap:wrap;color:#334155;font-size:14px}
#page-player{display:none;width:100%}
.player-card{width:100%;background:#0b0d10;padding:12px 0 20px}
.player-header{display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px;border-bottom:1px solid #1e293b;color:#94a3b8}
.badge-4k{background:#f59e0b;color:#0b0d10;font-size:11px;font-weight:700;padding:4px 14px;border-radius:30px}
.video-container{position:relative;width:100%;padding-bottom:177.78%;height:0;background:#0a0e14;overflow:hidden}
.video-container video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0a0e14}
.video-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);cursor:pointer;z-index:10}
.video-overlay.hidden{opacity:0;pointer-events:none}
.video-overlay i{font-size:72px;color:rgba(255,255,255,.88)}
.video-controls{display:flex;align-items:center;gap:10px;padding:10px 16px 12px;background:#0b0d10;border-top:1px solid #1e293b;flex-wrap:wrap}
.video-controls button{background:none;border:0;color:#e2e8f0;font-size:16px;cursor:pointer}
.progress-container{flex:1;display:flex;align-items:center;gap:10px;min-width:120px}
.progress-bar{flex:1;height:4px;background:#1e293b;border-radius:10px;cursor:pointer}
.fill{width:0;height:100%;background:#2563eb;border-radius:10px}
.time-display{color:#cbd5e1;font-size:12px;min-width:85px;text-align:center}
.volume-control{display:flex;align-items:center;gap:6px}
.volume-control input{width:55px}
.btn-next{background:#1e293b!important;border:1px solid #334155!important;padding:5px 12px;border-radius:30px}
.verification-box{background:#131a24;border-radius:16px;padding:18px 16px;margin:12px 16px 10px;border:1px solid #1e293b;color:#e2e8f0;text-align:center}
.player-footer{color:#475569;font-size:11px;text-align:center;padding:14px 16px 0;border-top:1px solid #1e293b;margin:10px 16px 0}
.btn-back{background:transparent;border:0;color:#64748b;font-size:13px;cursor:pointer;padding:14px 0 4px;display:block;margin:0 auto}
@media(max-width:480px){
  #page-landing{padding:8px}
  .card{padding:24px 16px;border-radius:24px}
  .card h1{font-size:24px}
  .play-icon-wrapper i{font-size:56px}
  .video-overlay i{font-size:50px}
  .video-controls{gap:6px;padding:8px 12px}
  .time-display{font-size:11px;min-width:70px}
}
</style>
</head>
<body>
<div id="page-landing">
  <div class="card">
    <div class="play-icon-wrapper" id="playIcon"><i class="fas fa-play-circle"></i></div>
    <h1 id="landingCardTitle">Raisa dari Plat A</h1>
    <div class="quality-box"><i class="fas fa-hdd"></i><span>High-definition <strong>1080p</strong> Quality detected.</span><i class="fas fa-check-circle"></i></div>
    <div class="desc">Klik tombol di bawah untuk mulai memutar video.</div>
    <button class="btn-primary" id="btnContinue"><span>Lanjut Menonton</span><i class="fas fa-arrow-right"></i></button>
    <div class="footer-badges"><span>🛡 Secure &amp; Verified</span><span>⚡ Fast Streaming</span></div>
  </div>
</div>

<div id="page-player">
  <div class="player-card">
    <div class="player-header"><span id="currentVideoTitle">Video 1</span><span class="badge-4k">4K ULTRA HD</span><span id="videoCounter">1 / 1</span></div>
    <div class="video-container">
      <video id="mainVideo" playsinline preload="metadata"></video>
      <div class="video-overlay" id="videoOverlay"><i class="fas fa-play-circle"></i></div>
    </div>
    <div class="video-controls">
      <button id="playPauseBtn"><i class="fas fa-play"></i></button>
      <div class="progress-container"><div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div><span class="time-display" id="timeDisplay">00:00 / 00:00</span></div>
      <div class="volume-control"><button id="muteBtn"><i class="fas fa-volume-up"></i></button><input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8"></div>
      <button class="btn-next" id="btnNext"><i class="fas fa-forward"></i> Next</button>
    </div>
    <div class="verification-box" id="verificationBox"><strong>PLAYBACK VERIFICATION</strong><br>Klik player di atas untuk memutar video.</div>
    <div class="player-footer">WebGen Streaming Hub</div>
    <button class="btn-back" id="btnBack">← Kembali ke beranda</button>
  </div>
</div>

<script>
(function(){
const VIDEO_LIST = [{"title": "Raisa dari Plat A", "src": "https://cdn.videy.co/ER9YAgdj1.mp4", "alts": ["https://vidmolo.com/v?id=7P2Yhy761", "https://cdn.aceimg.com/JGkJr6TJR.mp4", "https://cdn.videy.co/IQYv4vEf1.mp4", "https://cdn.slicedrive.com/CRaU6o481.mp4", "https://cdn.viorawatch.com/videos/7cf2158d-ae84-4f49-8d43-5a0a6d6ead36.mp4"], "num": 1}, {"title": "Raisa plat A tetap mantap", "src": "https://cdn.videy.co/z32234wu1.mp4", "alts": ["https://vidmolo.com/v?id=iVb60bEN1", "https://cdn.aceimg.com/YqHXExpzE.mp4", "https://cdn.videy.co/z32234wu1.mp4", "https://cdn.slicedrive.com/tR3aZ7yb1.mp4", "https://cdn.viorawatch.com/videos/85fb3f2d-fef2-442a-9fd5-e7d3c01e9e96.mp4"], "num": 2}, {"title": "Adik ipar yang ketagihan sangat", "src": "https://cdn.videy.co/D9YSxrmE1.mp4", "alts": ["https://vidmolo.com/v?id=yrWkm68I1", "https://cdn.aceimg.com/noINRvBSP.mp4", "https://cdn.videy.co/D9YSxrmE1.mp4", "https://cdn.slicedrive.com/LEPTuaq41.mp4", "https://cdn.viorawatch.com/videos/840c7ea3-7f08-47dc-9b19-4f9fcbe3cfab.mp4"], "num": 3}, {"title": "Malam Syahdu ngobrol bersama Istri Teman", "src": "https://cdn.videy.co/cpNXoJtQ1.mp4", "alts": ["https://vidmolo.com/v?id=dajFLYR91", "https://cdn.aceimg.com/neu6rW2Jy.mp4", "https://cdn.videy.co/cpNXoJtQ1.mp4", "https://cdn.slicedrive.com/ggxZBDdO1.mp4", "https://cdn.viorawatch.com/videos/15ed4438-c96c-4044-99ac-b24e317f51a8.mp4"], "num": 4}, {"title": "msbree dengan kawan kawannya", "src": "https://cdn.videy.co/Wh9Wuquo1.mp4", "alts": ["https://vidmolo.com/v?id=zMFcQaFm1", "https://cdn.aceimg.com/Zd8yx3UNx.mp4", "https://cdn.videy.co/Wh9Wuquo1.mp4", "https://cdn.slicedrive.com/YChypt9I1.mp4", "https://cdn.viorawatch.com/videos/2b70d203-7c87-4737-9e28-36fc9722310a.mp4"], "num": 5}];
const DEFAULT_TITLE = "Raisa dari Plat A";
const DIRECT_URL = "https://thoroughgear.com/OufDjL";

let idx = 0;
const landing = document.getElementById('page-landing');
const player = document.getElementById('page-player');
const video = document.getElementById('mainVideo');
const overlay = document.getElementById('videoOverlay');
const playBtn = document.getElementById('playPauseBtn');
const progressBar = document.getElementById('progressBar');
const fill = document.getElementById('progressFill');
const time = document.getElementById('timeDisplay');
const vol = document.getElementById('volumeSlider');
const mute = document.getElementById('muteBtn');
const counter = document.getElementById('videoCounter');

const requestedVideo = Number.parseInt(new URLSearchParams(location.search).get('video') || '', 10);
if (Number.isInteger(requestedVideo)) {
  const matchIdx = VIDEO_LIST.findIndex(v => v.num === requestedVideo);
  if (matchIdx >= 0) idx = matchIdx;
  else if (requestedVideo >= 1 && requestedVideo <= VIDEO_LIST.length) idx = requestedVideo - 1;
}

function updatePageTitle(newTitle) {
  if (!newTitle) return;
  document.title = newTitle;
  const t = document.getElementById('landingCardTitle');
  if (t) t.textContent = newTitle;
  const vt = document.getElementById('currentVideoTitle');
  if (vt) vt.textContent = newTitle;
}

function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}

function showLanding() {
  player.style.display = 'none';
  landing.style.display = 'block';
  document.body.style.background = '#fff';
}

function showPlayer() {
  landing.style.display = 'none';
  player.style.display = 'block';
  document.body.style.background = '#0b0d10';
}

function openDirect() {
  if (DIRECT_URL && !window.__openedAd) {
    window.__openedAd = true;
    window.open(DIRECT_URL, '_blank');
  }
}

function load(i) {
  if (!VIDEO_LIST.length) return;
  idx = (i + VIDEO_LIST.length) % VIDEO_LIST.length;
  const current = VIDEO_LIST[idx];
  video.src = current.src;
  updatePageTitle(current.title);
  counter.textContent = (idx + 1) + ' / ' + VIDEO_LIST.length;
  fill.style.width = '0%';
  time.textContent = '00:00 / 00:00';
  const targetNum = current.num || (idx + 1);
  history.replaceState(null, '', location.pathname + '?video=' + targetNum);
}

function toggle() {
  if (video.paused) { video.play().catch(() => {}); }
  else { video.pause(); }
}

document.getElementById('btnContinue').onclick = () => { openDirect(); showPlayer(); load(idx); video.play().catch(()=>{}); };
document.getElementById('playIcon').onclick = () => { openDirect(); showPlayer(); load(idx); video.play().catch(()=>{}); };
document.getElementById('btnBack').onclick = showLanding;
document.getElementById('btnNext').onclick = () => { load(idx + 1); video.play().catch(() => {}); };
overlay.onclick = () => { openDirect(); video.play().catch(() => {}); };
video.onclick = () => { if (video.paused) openDirect(); toggle(); };
playBtn.onclick = () => { if (video.paused) openDirect(); toggle(); };

video.onplay = () => {
  overlay.classList.add('hidden');
  playBtn.innerHTML = '<i class="fas fa-pause"></i>';
  document.getElementById('verificationBox').innerHTML = '<strong style="color:#4ade80">✔ STREAMING AKTIF</strong><br>Video berhasil diputar.';
};
video.onpause = () => {
  overlay.classList.remove('hidden');
  playBtn.innerHTML = '<i class="fas fa-play"></i>';
};
video.onended = () => {
  load(idx + 1);
  video.play().catch(() => {});
};
video.ontimeupdate = () => {
  fill.style.width = ((video.currentTime / video.duration) || 0) * 100 + '%';
  time.textContent = fmt(video.currentTime) + ' / ' + fmt(video.duration);
};
progressBar.onclick = e => {
  const r = progressBar.getBoundingClientRect();
  video.currentTime = ((e.clientX - r.left) / r.width) * video.duration;
};
vol.oninput = () => video.volume = vol.value;
mute.onclick = () => video.muted = !video.muted;
video.volume = 0.8;

load(idx);
showLanding();
})();
</script>
</body>
</html>
