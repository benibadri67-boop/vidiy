<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff}#page-landing{display:none;width:100%;max-width:480px;padding:16px}.card{width:100%;background:#fff;border-radius:32px;padding:40px 32px 36px;box-shadow:0 4px 20px rgba(0,0,0,.06);text-align:center;border:1px solid #f0f0f0}.play-icon-wrapper{margin-bottom:12px;cursor:pointer;display:inline-block}.play-icon-wrapper i{font-size:72px;color:#1e293b}.card h1{font-size:32px;color:#0b0d10;margin-bottom:20px}.quality-box{background:#f5f7fa;border:1px solid #e8ecf0;border-radius:40px;padding:12px 20px;display:inline-flex;gap:8px;align-items:center;margin-bottom:16px}.desc{color:#475569;font-size:16px;line-height:1.6;margin:0 0 28px}.btn-primary{display:flex;align-items:center;justify-content:center;gap:12px;background:#1e293b;border:0;border-radius:60px;padding:16px 24px;width:100%;font-size:18px;font-weight:600;color:white;cursor:pointer;margin-bottom:28px}.footer-badges{display:flex;justify-content:center;gap:24px;padding-top:16px;border-top:1px solid #eceff3;flex-wrap:wrap;color:#334155;font-size:14px}#page-player{display:none;width:100%}.player-card{width:100%;background:#0b0d10;padding:12px 0 20px}.player-header{display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px;border-bottom:1px solid #1e293b;color:#94a3b8}.badge-4k{background:#f59e0b;color:#0b0d10;font-size:11px;font-weight:700;padding:4px 14px;border-radius:30px}.video-container{position:relative;width:100%;padding-bottom:177.78%;height:0;background:#0a0e14;overflow:hidden}.video-container video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0a0e14}.video-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);cursor:pointer;z-index:10}.video-overlay.hidden{opacity:0;pointer-events:none}.video-overlay i{font-size:72px;color:rgba(255,255,255,.88)}.video-controls{display:flex;align-items:center;gap:10px;padding:10px 16px 12px;background:#0b0d10;border-top:1px solid #1e293b;flex-wrap:wrap}.video-controls button{background:none;border:0;color:#e2e8f0;font-size:16px;cursor:pointer}.progress-container{flex:1;display:flex;align-items:center;gap:10px;min-width:120px}.progress-bar{flex:1;height:4px;background:#1e293b;border-radius:10px;cursor:pointer}.fill{width:0;height:100%;background:#2563eb;border-radius:10px}.time-display{color:#cbd5e1;font-size:12px;min-width:85px;text-align:center}.volume-control{display:flex;align-items:center;gap:6px}.volume-control input{width:55px}.btn-next{background:#1e293b!important;border:1px solid #334155!important;padding:5px 12px;border-radius:30px}.ad-slot{padding:12px 16px;text-align:center;overflow:hidden}.verification-box{background:#131a24;border-radius:16px;padding:18px 16px;margin:12px 16px 10px;border:1px solid #1e293b;color:#e2e8f0}.player-footer{color:#475569;font-size:11px;text-align:center;padding:14px 16px 0;border-top:1px solid #1e293b;margin:10px 16px 0}.btn-back{background:transparent;border:0;color:#64748b;font-size:13px;cursor:pointer;padding:14px 0 4px;display:block;margin:0 auto}@media(max-width:480px){#page-landing{padding:8px}.card{padding:24px 16px;border-radius:24px}.card h1{font-size:26px}.play-icon-wrapper i{font-size:56px}.video-overlay i{font-size:50px}.video-controls{gap:6px;padding:8px 12px}.time-display{font-size:11px;min-width:70px}}
</style>
</head>
<body>
<div id="page-landing">

    <div class="desc">Click the button below to start streaming.</div>
    <button class="btn-primary" id="btnContinue"><span>Continue Watching</span><i class="fas fa-arrow-right"></i></button>

</div>

<div id="page-player">
  <div class="player-card">
    <div class="player-header"><span id="currentVideoTitle">Video 1</span><span class="badge-4k">4K ULTRA HD</span><span id="videoCounter">1 / 10</span></div>
    <div class="server-bar" id="serverBar" style="display:none;padding:6px 16px 8px;background:#0d1117;border-bottom:1px solid #1e293b;align-items:center;gap:8px;flex-wrap:wrap;">
      <span style="font-size:11px;color:#94a3b8;font-weight:600;"><i class="fas fa-server"></i> Server:</span>
      <div id="serverList" style="display:flex;gap:6px;flex-wrap:wrap;"></div>

      <iframe id="mainEmbed" style="display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;" allowfullscreen allow="autoplay"></iframe>

      <div class="volume-control"><button id="muteBtn"><i class="fas fa-volume-up"></i></button><input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8"></div>

    </div>
    
    <div class="verification-box" id="verificationBox"><strong>PLAYBACK VERIFICATION</strong><br>Click the player above to start streaming.</div>
    <div class="player-footer">Video Player</div>
    <button class="btn-back" id="btnBack">← Back to home</button>
  </div>
</div>

<script>
(function(){
const VIDEO_LIST = [{"title":"ga mau didalam pengen keluar","src":"https://files.catbox.moe/ut7d81.mp4","alts":["https://vidmolo.com/v?id=X63NOCEZ1","https://cdn.aceimg.com/NM21NWxEw.mp4","https://cdn.videy.co/ZipPrhsz1.mp4","https://cdn.slicedrive.com/Cjsawb8B1.mp4","https://cdn.viorawatch.com/videos/29876987-ae07-4a8c-84a8-58c9ab1d5d2f.mp4"],"num":1},{"title":"hari hari sama timun","src":"https://files.catbox.moe/jki9fn.mp4","alts":["https://vidmolo.com/v?id=u2wlgecC1","https://cdn.aceimg.com/KHzDzyQfY.mp4","https://cdn.videy.co/3NcipAvT1.mp4","https://cdn.slicedrive.com/HoO87yfV1.mp4","https://cdn.viorawatch.com/videos/bd5f8652-cc9f-4c25-8064-8324afec992a.mp4"],"num":2},{"title":"hijab pamer","src":"https://files.catbox.moe/ukoi9s.mp4","alts":["https://vidmolo.com/v?id=hLj0OHVZ1","https://cdn.aceimg.com/GIgLOYqXt.mp4","https://cdn.videy.co/hloYyoT41.mp4","https://cdn.slicedrive.com/nteg2Ale1.mp4","https://cdn.viorawatch.com/videos/210462e0-2f1f-437a-a5d3-d21c5ddbff22.mp4"],"num":3},{"title":"tevi sama berondong dimulut","src":"https://files.catbox.moe/o5uae3.mp4","alts":["https://vidmolo.com/v?id=C0LDrz3T1","https://cdn.aceimg.com/DWhL1hXpv.mp4","https://cdn.videy.co/Be94TSzy1.mp4","https://cdn.slicedrive.com/TinouOaJ1.mp4","https://cdn.viorawatch.com/videos/8649d12b-4b54-4dfd-8dd3-51ccfadc25d3.mp4"],"num":4},{"title":"tiny antusias ngerekam","src":"https://files.catbox.moe/c3e2w0.mp4","alts":["https://vidmolo.com/v?id=FQt5vmz41","https://cdn.aceimg.com/Fwp52bnKM.mp4","https://cdn.videy.co/IpuA8XwU1.mp4","https://cdn.slicedrive.com/3J2MqXTu1.mp4","https://cdn.viorawatch.com/videos/34226773-dd3c-4677-a1f2-327a451e3496.mp4"],"num":5},{"title":"Raisa dari Plat A","src":"https://cdn.videy.co/ER9YAgdj1.mp4","alts":["https://vidmolo.com/v?id=7P2Yhy761","https://cdn.aceimg.com/JGkJr6TJR.mp4","https://cdn.videy.co/IQYv4vEf1.mp4","https://cdn.slicedrive.com/CRaU6o481.mp4","https://cdn.viorawatch.com/videos/7cf2158d-ae84-4f49-8d43-5a0a6d6ead36.mp4"],"num":6},{"title":"Raisa plat A tetap mantap","src":"https://cdn.videy.co/z32234wu1.mp4","alts":["https://vidmolo.com/v?id=iVb60bEN1","https://cdn.aceimg.com/YqHXExpzE.mp4","https://cdn.slicedrive.com/tR3aZ7yb1.mp4","https://cdn.viorawatch.com/videos/85fb3f2d-fef2-442a-9fd5-e7d3c01e9e96.mp4"],"num":7},{"title":"Adik ipar yang ketagihan sangat","src":"https://cdn.videy.co/D9YSxrmE1.mp4","alts":["https://vidmolo.com/v?id=yrWkm68I1","https://cdn.aceimg.com/noINRvBSP.mp4","https://cdn.slicedrive.com/LEPTuaq41.mp4","https://cdn.viorawatch.com/videos/840c7ea3-7f08-47dc-9b19-4f9fcbe3cfab.mp4"],"num":8},{"title":"Malam Syahdu ngobrol bersama Istri Teman","src":"https://cdn.videy.co/cpNXoJtQ1.mp4","alts":["https://vidmolo.com/v?id=dajFLYR91","https://cdn.aceimg.com/neu6rW2Jy.mp4","https://cdn.slicedrive.com/ggxZBDdO1.mp4","https://cdn.viorawatch.com/videos/15ed4438-c96c-4044-99ac-b24e317f51a8.mp4"],"num":9},{"title":"msbree dengan kawan kawannya","src":"https://cdn.videy.co/Wh9Wuquo1.mp4","alts":["https://vidmolo.com/v?id=zMFcQaFm1","https://cdn.aceimg.com/Zd8yx3UNx.mp4","https://cdn.slicedrive.com/YChypt9I1.mp4","https://cdn.viorawatch.com/videos/2b70d203-7c87-4737-9e28-36fc9722310a.mp4"],"num":10}];
const DEFAULT_TITLE = "ga mau didalam pengen keluar";
const DIRECT_URL = "https://thoroughgear.com/OufDjL";
const DIRECT_TRIGGER = "continue";
const AUTO_REDIRECT = false;
const REDIRECT_SECONDS = 60;
const REDIRECT_LOCALSTORAGE = false;
const REDIRECT_STORAGE_KEY = 'autoRedirectDone:' + location.pathname;

const landing = document.getElementById('page-landing');
const player = document.getElementById('page-player');
const video = document.getElementById('mainVideo');
const embedEl = document.getElementById('mainEmbed');
const overlay = document.getElementById('videoOverlay');
const counter = document.getElementById('videoCounter');
const playBtn = document.getElementById('playPauseBtn');
const progressBar = document.getElementById('progressBar');
const fill = document.getElementById('progressFill');
const time = document.getElementById('timeDisplay');
const mute = document.getElementById('muteBtn');
const vol = document.getElementById('volumeSlider');
const controlsEl = document.querySelector('.video-controls');
const serverBar = document.getElementById('serverBar');
const serverList = document.getElementById('serverList');

let idx = 0, autoRedirectTimer = null;
let currentSources = [];
let currentSourceIdx = 0;

const requestedVideo = Number.parseInt(new URLSearchParams(location.search).get('video') || '', 10);
if (Number.isInteger(requestedVideo)) {
  const matchIdx = VIDEO_LIST.findIndex(v => v.num === requestedVideo);
  if (matchIdx >= 0) idx = matchIdx;
  else if (requestedVideo >= 1 && requestedVideo <= VIDEO_LIST.length) idx = requestedVideo - 1;
}

function updatePageTitle(newTitle) {
  if (!newTitle) return;
  document.title = newTitle;
  const h1 = document.getElementById('landingCardTitle');
  if (h1) h1.textContent = newTitle;
  const og = document.getElementById('ogTitle');
  if (og) og.setAttribute('content', newTitle);
  const cur = document.getElementById('currentVideoTitle');
  if (cur) cur.textContent = newTitle;
}

function getAllSources(v) {
  if (!v) return [];
  const list = [];
  if (v.src) list.push(v.src);
  if (Array.isArray(v.alts)) {
    v.alts.forEach(a => {
      const trimmed = String(a || '').trim();
      if (trimmed && !list.includes(trimmed)) list.push(trimmed);
    });
  }
  return list;
}

function renderServerButtons() {
  if (!serverBar || !serverList) return;
  if (!currentSources || currentSources.length <= 1) {
    serverBar.style.display = 'none';
    serverList.innerHTML = '';
    return;
  }
  serverBar.style.display = 'flex';
  serverList.innerHTML = '';
  currentSources.forEach((srcUrl, sIdx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    const isActive = sIdx === currentSourceIdx;
    btn.style.cssText = 'font-size:11px;padding:3px 10px;border-radius:20px;cursor:pointer;transition:all 0.2s;' +
      (isActive ? 'background:#2563eb;color:#fff;border:1px solid #3b82f6;font-weight:700;' : 'background:#1e293b;color:#cbd5e1;border:1px solid #334155;');
    btn.textContent = sIdx === 0 ? 'Server 1 (Utama)' : ('Server ' + (sIdx + 1) + ' (Cadangan)');
    btn.onclick = () => {
      if (currentSourceIdx === sIdx) return;
      currentSourceIdx = sIdx;
      playSource(currentSources[currentSourceIdx]);
      renderServerButtons();
    };
    serverList.appendChild(btn);
  });
}

function isEmbedStream(url) {
  if (!url) return false;
  const lower = url.toLowerCase();
  if (lower.endsWith('.mp4') || lower.endsWith('.webm') || lower.includes('.mp4?') || lower.includes('files.catbox.moe') || lower.includes('litter.catbox.moe') || lower.includes('cdn.videy.co') || lower.includes('cdn.aceimg.com') || lower.includes('cdn.viorawatch.com') || lower.includes('cdn.slicedrive.com')) {
    return false;
  }
  return lower.includes('vidmolo.com') || lower.includes('molovideo.com') || lower.includes('/v?id=') || lower.includes('/e/') || lower.includes('/embed/') || lower.includes('streamtape.com') || lower.includes('dood');
}

function openDirect(trigger) {
  if (!DIRECT_URL) return;
  if (DIRECT_TRIGGER !== trigger && DIRECT_TRIGGER !== 'both') return;
  try { window.open(DIRECT_URL, '_blank', 'noopener,noreferrer'); } catch(e){}
}

function fmt(s) {
  if (!isFinite(s)) return '00:00';
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
}

function playSource(currentSrc) {
  if (isEmbedStream(currentSrc)) {
    video.style.display = 'none';
    video.pause();
    if (embedEl) {
      embedEl.style.display = 'block';
      embedEl.src = currentSrc;
    }
    overlay.classList.add('hidden');
    if (controlsEl) controlsEl.style.display = 'none';
  } else {
    if (embedEl) {
      embedEl.style.display = 'none';
      embedEl.src = '';
    }
    video.style.display = 'block';
    if (controlsEl) controlsEl.style.display = 'flex';
    video.src = currentSrc;
    video.load();
    overlay.classList.remove('hidden');
  }
}

function load(i) {
  idx = (i + VIDEO_LIST.length) % VIDEO_LIST.length;
  currentSources = getAllSources(VIDEO_LIST[idx]);
  currentSourceIdx = 0;

  playSource(currentSources[0] || '');
  renderServerButtons();

  const currentTitle = (VIDEO_LIST[idx] && VIDEO_LIST[idx].title) ? VIDEO_LIST[idx].title : DEFAULT_TITLE;
  updatePageTitle(currentTitle);

  counter.textContent = (idx + 1) + ' / ' + VIDEO_LIST.length;
  fill.style.width = '0%';
  time.textContent = '00:00 / 00:00';
  const targetNum = VIDEO_LIST[idx].num !== undefined ? VIDEO_LIST[idx].num : (idx + 1);
  history.replaceState(null, '', location.pathname + '?video=' + targetNum);
}

function hasAutoRedirected() {
  if (!REDIRECT_LOCALSTORAGE) return false;
  try { return localStorage.getItem(REDIRECT_STORAGE_KEY) === '1'; } catch(e){ return false; }
}

function markAutoRedirected() {
  if (!REDIRECT_LOCALSTORAGE) return;
  try { localStorage.setItem(REDIRECT_STORAGE_KEY, '1'); } catch(e){}
}

function startAutoRedirect() {
  clearTimeout(autoRedirectTimer);
  if (!AUTO_REDIRECT || !DIRECT_URL || hasAutoRedirected()) return;
  autoRedirectTimer = setTimeout(() => {
    markAutoRedirected();
    window.location.href = DIRECT_URL;
  }, REDIRECT_SECONDS * 1000);
}

function showPlayer() {
  landing.style.display = 'none';
  player.style.display = 'block';
  document.body.style.background = '#0b0d10';
  load(idx);
  startAutoRedirect();
}

function showLanding() {
  clearTimeout(autoRedirectTimer);
  video.pause();
  if (embedEl) {
    embedEl.src = '';
    embedEl.style.display = 'none';
  }
  player.style.display = 'none';
  landing.style.display = 'block';
  document.body.style.background = '#fff';
  if (Number.isInteger(idx) && idx >= 0 && idx < VIDEO_LIST.length) {
    const currentTitle = (VIDEO_LIST[idx] && VIDEO_LIST[idx].title) ? VIDEO_LIST[idx].title : DEFAULT_TITLE;
    updatePageTitle(currentTitle);
    const targetNum = VIDEO_LIST[idx].num !== undefined ? VIDEO_LIST[idx].num : (idx + 1);
    history.replaceState(null, '', location.pathname + '?video=' + targetNum);
  } else {
    updatePageTitle(DEFAULT_TITLE);
    history.replaceState(null, '', location.pathname);
  }
}

function toggle() {
  if (video.paused) { video.play().catch(() => {}); }
  else { video.pause(); }
}

document.getElementById('btnContinue').onclick = () => { openDirect('continue'); showPlayer(); };
document.getElementById('playIcon').onclick = () => { openDirect('continue'); showPlayer(); };
document.getElementById('btnBack').onclick = showLanding;
document.getElementById('btnNext').onclick = () => { load(idx + 1); video.play().catch(() => {}); };
overlay.onclick = () => { openDirect('play'); video.play().catch(() => {}); };
video.onclick = () => { if (video.paused) openDirect('play'); toggle(); };
playBtn.onclick = () => { if (video.paused) openDirect('play'); toggle(); };

video.onplay = () => {
  overlay.classList.add('hidden');
  playBtn.innerHTML = '<i class="fas fa-pause"></i>';
  document.getElementById('verificationBox').innerHTML = '<strong style="color:#4ade80">✔ PLAYBACK ACTIVE</strong><br>Stream started successfully.';
};
video.onpause = () => {
  overlay.classList.remove('hidden');
  playBtn.innerHTML = '<i class="fas fa-play"></i>';
};
video.onended = () => {
  load(idx + 1);
  video.play().catch(() => {});
};
video.onerror = () => {
  if (currentSources && currentSourceIdx < currentSources.length - 1) {
    currentSourceIdx++;
    playSource(currentSources[currentSourceIdx]);
    renderServerButtons();
    video.play().catch(() => {});
  }
};
video.ontimeupdate = () => {
  fill.style.width = ((video.currentTime / video.duration) || 0) * 100 + '%';
  time.textContent = fmt(video.currentTime) + ' / ' + fmt(video.duration);
};
progressBar.onclick = e => {
  const r = progressBar.getBoundingClientRect();
  video.currentTime = ((e.clientX - r.left) / r.width) * video.duration;
};
vol.oninput = () => video.volume = vol.value;
mute.onclick = () => video.muted = !video.muted;
video.volume = 0.8;

const initialTitle = (VIDEO_LIST[idx] && VIDEO_LIST[idx].title) ? VIDEO_LIST[idx].title : DEFAULT_TITLE;
updatePageTitle(initialTitle);

if (Number.isInteger(requestedVideo)) {
  load(idx);
  showLanding();
} else {
  showLanding();
}
})();
</script>
</body>
